project:
  type: website
  output-dir: _book
  resources:
    - data/
    - scripts/

website:
  title: "Data Science for Higher Ed"
  site-url: https://mlittrell-ttu.github.io/data-science-higher-ed/
  repo-url: https://github.com/mlittrell-ttu/data-science-higher-ed
  repo-actions: [edit, issue, source]
  search: true
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: setup.qmd
        text: Setup
    right:
      - icon: github
        href: https://github.com/mlittrell-ttu/data-science-higher-ed
  sidebar:
    style: docked
    title: "Modules"
    collapse-level: 1
    contents:
      - text: "Home"
        href: index.qmd
      - section: "Part 1 — Applied R"
        contents:
          - 01.qmd
          - 02.qmd
          - 03.qmd
          - 04.qmd
          - 05.qmd
          - 06.qmd
          - 07.qmd
          - 08.qmd
          - 09.qmd
      - section: "Part 2 — Machine Learning"
        contents:
          - ph1.qmd
      - section: "Part 3 — Quarto"
        contents:
          - ph2.qmd
      - section: "Part 4 — Shiny"
        contents:
          - ph3.qmd
      - summary.qmd
      - references.qmd
      - setup.qmd
  page-footer:
    center: "© 2026 Michael Littrell. Licensed under [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)."

filters:
  - include-code-files

bibliography: references.bib

format:
  html:
    theme:
      - cosmo
      - theme.scss
    include-in-header:
      - text: |
          <script data-goatcounter="https://heds.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    code-copy: true
    code-link: true
    code-overflow: wrap
    toc: true
    number-sections: false

knitr:
  opts_chunk:
    comment: "#>"
    collapse: true

execute:
  freeze: auto
  echo: true
  warning: false
  message: false

editor: source