project:
  type: book
  output-dir: _book
  resources:
    - data/
  # --- Custom domain note -------------------------------------------------
  # To keep a custom domain across re-publishes, edit the CNAME file (put your
  # bare domain in it, e.g. rbook.example.com) and then UNCOMMENT the two lines
  # below so Quarto copies CNAME into the built site on every render. Leave them
  # commented until your domain is real, or your first deploy will break.
  # resources:
  #   - CNAME

book:
  title: "Applied Data Science in Higher Education with R"
  subtitle: "A practical, open resource for pragmatic data science."
  author: "Michael Littrell"
  date: today
  cover-image: images/cover_v1.png
  # favicon: images/favicon.png 
  site-url: https://mlittrell-ttu.github.io/data-science-higher-ed/   
  repo-url: https://github.com/mlittrell-ttu/data-science-higher-ed
  repo-branch: main
  repo-actions: [edit, issue, source] # adds "Edit this page" links
  search: true
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "Part 1 — Applied R"
      chapters:
        - 01.qmd
        - 02.qmd
        - 03.qmd
        - 04.qmd
        - 05.qmd
        - 06.qmd
        - 07.qmd
        - 08.qmd
        - 09.qmd
    - part: "Part 2 — Machine Learning"
      chapters:
        - ph1.qmd
    - part: "Part 3 — Quarto"
      chapters:
        - ph2.qmd
    - part: "Part 4 — Shiny"
      chapters:
        - ph3.qmd
        
    - summary.qmd
    - references.qmd
  appendices:
    - setup.qmd
  page-footer:
    center: "© 2026 Michael Littrell. Licensed under [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)."

filters:
  - include-code-files

bibliography: references.bib
# csl: apa.csl   # APA fits higher ed. Download apa.csl from the CSL project into
                 # this folder, then uncomment. Without it, Quarto uses Chicago.

format:
  html:
    theme:
      - cosmo
      - theme.scss
    include-in-header:
      - text: |
          <script data-goatcounter="https://heds.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    code-copy: true
    code-link: true
    code-overflow: wrap
    toc: true
    number-sections: true

knitr:
  opts_chunk:
    comment: "#>"
    collapse: true


execute:
  freeze: auto      # a chapter re-renders only when its own code changes
  echo: true
  warning: false
  message: false

editor: source
