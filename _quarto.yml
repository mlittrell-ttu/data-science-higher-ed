project:
  type: website
  output-dir: _book
  resources:
    - data/
    - scripts/

website:
  title: "Data Science for Higher Ed"
  site-url: https://mlittrell-ttu.github.io/data-science-higher-ed/
  repo-url: https://github.com/mlittrell-ttu/data-science-higher-ed
  repo-actions: [edit, issue, source]
  search: true
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: Courses
        menu:
          - href: applied-r/index.qmd
            text: Applied R
          - href: machine-learning/index.qmd
            text: Machine Learning
          - href: quarto-course/index.qmd
            text: Quarto
          - href: shiny/index.qmd
            text: Shiny
      - href: setup.qmd
        text: Setup
    right:
      - icon: github
        href: https://github.com/mlittrell-ttu/data-science-higher-ed
  sidebar:
    - id: applied-r
      title: "Applied R"
      style: docked
      collapse-level: 1
      contents:
        - text: "Course home"
          href: applied-r/index.qmd
        - applied-r/01.qmd
        - applied-r/02.qmd
        - applied-r/03.qmd
        - applied-r/04.qmd
        - applied-r/05.qmd
        - applied-r/06.qmd
        - applied-r/07.qmd
        - applied-r/08.qmd
        - applied-r/09.qmd
    - id: machine-learning
      title: "Machine Learning"
      style: docked
      contents:
        - machine-learning/index.qmd
        - machine-learning/ph1.qmd
    - id: quarto-course
      title: "Quarto"
      style: docked
      contents:
        - quarto-course/index.qmd
        - quarto-course/ph2.qmd
    - id: shiny
      title: "Shiny"
      style: docked
      contents:
        - shiny/index.qmd
        - shiny/ph3.qmd
  page-footer:
    center: "© 2026 Michael Littrell. Licensed under [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)."

filters:
  - include-code-files

bibliography: references.bib

format:
  html:
    theme:
      - cosmo
      - theme.scss
    include-in-header:
      - text: |
          <script data-goatcounter="https://heds.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    code-copy: true
    code-link: true
    code-overflow: wrap
    toc: true
    number-sections: false

knitr:
  opts_chunk:
    comment: "#>"
    collapse: true

execute:
  freeze: auto
  echo: true
  warning: false
  message: false

editor: source